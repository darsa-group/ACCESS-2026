on:
  push:
     branches:
       - source
  schedule:
    - cron: "5 9 * * *"

name: deploy website

jobs:
  blogdown:
    runs-on: ubuntu-latest
    env:
      GOOGLE_SERVICE_JSON_KEY: ${{ secrets.GOOGLE_SERVICE_JSON_KEY }}
      PEOPLE_GOOGLE_SHEET_ID: ${{ secrets.PEOPLE_GOOGLE_SHEET_ID }}
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      RENV_CONFIG_AUTOLOADER_ENABLED: "false"
      R_LIBS_USER: ~/R/Library
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-pandoc@v2
      - name: Cache R package library
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: ${{ runner.os }}-r-lib-${{ hashFiles('.github/workflows/deploy.yaml', 'install_packages.R') }}
          restore-keys: |
            ${{ runner.os }}-r-lib-
      - name: Cache Hugo binary
        uses: actions/cache@v4
        with:
          path: ~/.local/share/Hugo
          key: ${{ runner.os }}-hugo-0.101.0
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev libfontconfig1-dev libharfbuzz-dev libfribidi-dev libfreetype6-dev libuv1-dev
      - name: Install R package dependencies
        run: Rscript --vanilla -e 'pkgs <- c("rmarkdown","blogdown","googlesheets4","glue","dplyr","rlang","RefManageR","kableExtra","bibtex","rjson","data.table","htmlwidgets","sass","bslib","fs","remotes","checkmate"); installed <- rownames(installed.packages()); missing <- setdiff(pkgs, installed); if (length(missing)) install.packages(missing, repos = "https://cloud.r-project.org/")'
      - name: Install slickR from GitHub
        run: Rscript --vanilla -e 'if (!requireNamespace("slickR", quietly = TRUE)) remotes::install_github("yonicd/slickR", dependencies = FALSE, upgrade = "never")'
      - name: Install Hugo
        run: Rscript --vanilla -e 'if (!blogdown::hugo_available("0.101.0")) blogdown::install_hugo("0.101.0")'
      - name: Proprocess website data
        run: Rscript --vanilla _preprocess.R
      - name: Build site
        run: rm -rf public/ && Rscript --vanilla -e 'blogdown::build_site(build_rmd = TRUE)'
      - name: Deploy to main
        uses: peaceiris/actions-gh-pages@v3.7.3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: main
          force_orphan: true
          allow_empty_commit: true
